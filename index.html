<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --nebula: #a020f0; --cyan: #00ffff; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding: 25px; text-align: center; margin: 0; }
        .card { background: #111; border: 2px solid var(--nebula); border-radius: 20px; padding: 30px; box-shadow: 0 0 25px rgba(160, 32, 240, 0.5); }
        .header { font-size: 24px; font-weight: 900; color: var(--cyan); letter-spacing: 2px; }
        .sub { font-size: 10px; color: var(--nebula); text-transform: uppercase; margin-bottom: 30px; font-weight: bold; }
        .btn { width: 100%; background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 16px; border-radius: 12px; font-weight: bold; margin-bottom: 15px; }
        .btn:active { background: var(--cyan); color: #000; box-shadow: 0 0 30px var(--cyan); }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">NEBULA CORE</div>
        <div class="sub">G85 OVERRIDE ACTIVE</div>
        <button class="btn" onclick="alert('Bypass Engaged!')">SYSTEM OVERRIDE</button>
        <button class="btn" onclick="alert('Touch Sync Active!')">TOUCH RESPONSE PRO</button>
        <button class="btn" onclick="alert('Memory Purged!')">AI RAM CLEANER</button>
    </div>
</body>
</html>
